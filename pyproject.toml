[project]
name = "music-notation-mastery"
version = "0.1.0"
description = "Generate an Anki deck for learning music notation"
requires-python = ">=3.12"
dependencies = ["genanki>=0.13.1,<0.14"]

[project.scripts]
build = "music_notation_mastery.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
